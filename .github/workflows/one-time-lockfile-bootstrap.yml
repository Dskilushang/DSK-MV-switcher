name: One-time dependency lockfile bootstrap

on:
  push:
    branches: [feat/native-background-streaming-service]

permissions:
  contents: write

jobs:
  generate-lockfiles:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/native-background-streaming-service
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate root lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify root lockfile with npm ci
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Generate Camera companion lockfile
        working-directory: camera-companion
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify Camera lockfile with npm ci
        working-directory: camera-companion
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Commit generated lockfiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json camera-companion/package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes to commit."
            exit 0
          fi
          git commit -m "chore: lock root and camera dependencies"
          git push origin HEAD:feat/native-background-streaming-service
