name: Build Android APK

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:

  build-camera-companion:
    name: Build DSK Camera Android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: camera-companion
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Installer les dépendances DSK Camera
        run: npm install

      - name: Vérifier TypeScript et compiler DSK Camera
        run: npm run build

      - name: Générer le projet Android natif
        run: npx cap add android

      - name: Synchroniser Capacitor
        run: npx cap sync android

      - name: Déclarer et vérifier la permission caméra Android
        run: |
          python - <<'PY'
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          source = manifest.read_text(encoding="utf-8")
          opening = re.search(r"<manifest\b[^>]*>", source)
          if opening is None:
              raise SystemExit("Balise manifest introuvable")
          additions = []
          if "android.permission.CAMERA" not in source:
              additions.append('    <uses-permission android:name="android.permission.CAMERA" />')
          if "android.hardware.camera.any" not in source:
              additions.append('    <uses-feature android:name="android.hardware.camera.any" android:required="true" />')
          if additions:
              source = source[:opening.end()] + "\n" + "\n".join(additions) + source[opening.end():]
          root = ET.fromstring(source)
          ns = "{http://schemas.android.com/apk/res/android}"
          permissions = [node.attrib.get(ns + "name") for node in root.findall("uses-permission")]
          features = [node.attrib.get(ns + "name") for node in root.findall("uses-feature")]
          if "android.permission.CAMERA" not in permissions:
              raise SystemExit("Permission CAMERA absente du manifeste")
          if "android.hardware.camera.any" not in features:
              raise SystemExit("Fonction caméra absente du manifeste")
          manifest.write_text(source, encoding="utf-8")
          print("OK : permission CAMERA et fonctionnalité caméra déclarées.")
          PY

      - name: Compiler l’APK DSK Camera
        working-directory: camera-companion/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Sauvegarder l’APK DSK Camera
        uses: actions/upload-artifact@v4
        with:
          name: dsk-camera-android-debug
          path: camera-companion/android/app/build/outputs/apk/debug/app-debug.apk
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Installer les dépendances
        run: npm install

      - name: Vérifier les types TypeScript
        run: npx tsc --noEmit

      - name: Vérifier la syntaxe du DSK Audio Receiver
        run: node --check receiver/server.mjs

      - name: Compiler l'application web (Vite)
        run: npm run build

      - name: Ajouter la plateforme Android
        run: npx cap add android

      - name: Synchroniser Capacitor
        run: npx cap sync android

      - name: Verrouiller Android en mode paysage
        run: |
          python - <<'PY'
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          if not manifest.is_file():
              raise SystemExit(f"Manifeste Android introuvable : {manifest}")

          source = manifest.read_text(encoding="utf-8")
          manifest_opening = re.search(r"<manifest\b[^>]*>", source, re.DOTALL)
          if manifest_opening is None:
              raise SystemExit("Balise manifest introuvable")

          required_permissions = [
              "android.permission.CAMERA",
          ]
          missing_permissions = [
              permission for permission in required_permissions
              if f'android:name="{permission}"' not in source
          ]
          if missing_permissions:
              permission_xml = "".join(
                  f'\n    <uses-permission android:name="{permission}" />'
                  for permission in missing_permissions
              )
              insert_at = manifest_opening.end()
              source = source[:insert_at] + permission_xml + source[insert_at:]
          activity_pattern = re.compile(r"<activity\b[^>]*>.*?</activity>", re.DOTALL)
          matches = list(activity_pattern.finditer(source))
          launchers = [
              match for match in matches
              if "android.intent.action.MAIN" in match.group(0)
              and "android.intent.category.LAUNCHER" in match.group(0)
          ]
          if len(launchers) != 1:
              raise SystemExit(f"Une seule Activity MAIN/LAUNCHER attendue, trouvé : {len(launchers)}")

          match = launchers[0]
          opening = re.search(r"<activity\b[^>]*>", match.group(0), re.DOTALL)
          if opening is None:
              raise SystemExit("Balise Activity principale introuvable")

          tag = re.sub(r'\s+android:screenOrientation="[^"]*"', "", opening.group(0))
          tag = tag[:-1] + ' android:screenOrientation="landscape">'
          updated_activity = match.group(0)[:opening.start()] + tag + match.group(0)[opening.end():]
          updated = source[:match.start()] + updated_activity + source[match.end():]

          root = ET.fromstring(updated)
          ns = "{http://schemas.android.com/apk/res/android}"
          verified = []
          for activity in root.findall("application/activity"):
              has_main = any(
                  item.attrib.get(ns + "name") == "android.intent.action.MAIN"
                  for filt in activity.findall("intent-filter")
                  for item in filt.findall("action")
              )
              has_launcher = any(
                  item.attrib.get(ns + "name") == "android.intent.category.LAUNCHER"
                  for filt in activity.findall("intent-filter")
                  for item in filt.findall("category")
              )
              if has_main and has_launcher and activity.attrib.get(ns + "screenOrientation") == "landscape":
                  verified.append(activity)

          if len(verified) != 1:
              raise SystemExit("Échec de vérification : l'Activity de lancement n'est pas en paysage")

          manifest.write_text(updated, encoding="utf-8")
          print("OK : Activity principale Android verrouillée en landscape.")
          PY

      - name: Compiler l'APK (Debug)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Sauvegarder l'APK
        uses: actions/upload-artifact@v4
        with:
          name: dsk-r8-apk-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
