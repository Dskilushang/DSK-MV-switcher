buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.1'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.25'
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'com.dskmv.streaming'
    // Capacitor 6 / Android 14 : nécessaire pour FOREGROUND_SERVICE_TYPE_SPECIAL_USE.
    compileSdk 34

    defaultConfig {
        minSdk 22
        targetSdk 34
    }

    // Aligne les compilateurs Java et Kotlin sur JVM 17.
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation project(':capacitor-android')
    implementation 'androidx.core:core-ktx:1.13.1'
}
